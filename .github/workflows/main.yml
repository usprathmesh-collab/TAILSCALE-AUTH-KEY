
name: Secure RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          New-NetFirewallRule `
            -DisplayName "RDP over Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Action Allow `
            -ErrorAction SilentlyContinue

      - name: Create RDP User
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing"
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $securePass
          }
          else {
            New-LocalUser -Name "RDP" `
              -Password $securePass `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured successfully"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest $url -OutFile $file

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait

          Remove-Item $file -Force

      - name: Connect Tailscale
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY is missing"
          }

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $exe up `
            "--authkey=$env:TS_AUTH_KEY" `
            "--hostname=secure-rdp-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {
            $ip = (& $exe ip -4 | Select-Object -First 1).Trim()

            if ($ip) { break }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "Tailscale IP unavailable"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected"

      - name: Verify RDP
        shell: pwsh
        run: |
          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
            throw "RDP port 3389 is unavailable"
          }

          Write-Host "RDP connectivity successful"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "RDP ADDRESS: $env:TAILSCALE_IP"
          Write-Host "USERNAME: .\RDP"
          Write-Host "Password is stored securely in GitHub Secrets"

          while ($true) {
            Write-Host "RDP connection active"
            Start-Sleep -Seconds 300
          }
